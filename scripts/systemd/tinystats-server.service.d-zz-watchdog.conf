# Leak guard for tinystats — added 2026-09-03 alongside the v1.1.1 rollout.
#
# MemoryMax: tinystats sits at ~4 MB RSS steady-state, so 128M is ample headroom for the hub+dashboards.
# If a leak regression ever reappears (the pre-1.1.1 rate was ~190 MB/day on a
# client, ~870 MB/day on the server) the cgroup OOM-kills it long before it
# costs the host anything, and Restart=always brings it straight back.
#
# RuntimeMaxSec: unconditional 24h recycle as a backstop, in case a future leak
# grows too slowly to trip MemoryMax but still drifts over weeks. Expiry sends
# SIGTERM; the unit lands in failed state and Restart=always restarts it after
# RestartSec. A client is out for ~5s, which is one missed report.
[Service]
MemoryMax=128M
MemorySwapMax=0
RuntimeMaxSec=86400
Restart=always
RestartSec=5
